name: CI - gateway

on:
  push:
    branches: ['**']
    paths:
      - 'gateway/**'
      - 'packages/authz/**'
      - 'tsconfig.base.json'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'gateway/**'
      - 'packages/authz/**'
      - 'tsconfig.base.json'
      - '.github/workflows/gateway-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 4000
      LOG_LEVEL: silent
      AUTH_JWKS_URL: http://localhost:4001/v1/auth/.well-known/jwks.json
      AUTH_SERVICE_URL: http://localhost:4001
      APPOINTMENTS_SERVICE_URL: http://localhost:4002
      DOCTORS_SERVICE_URL: http://localhost:4003
      PAYMENTS_SERVICE_URL: http://localhost:4004
      NOTIFICATIONS_SERVICE_URL: http://localhost:4005

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz no esta publicado, hay que instalar desde
      # la raiz (ver build: convertir el repo en npm workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=gateway --workspace=packages/authz --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Lint
        working-directory: gateway
        run: npm run lint

      - name: Typecheck
        working-directory: gateway
        run: npm run typecheck

      - name: Test
        working-directory: gateway
        run: npm run test
