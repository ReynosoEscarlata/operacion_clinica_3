name: CI - messaging

on:
  push:
    branches: ['**']
    paths:
      - 'packages/messaging/**'
      - '.github/workflows/messaging-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'packages/messaging/**'
      - '.github/workflows/messaging-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      # Fase 3b (ADR-014): los tests de este paquete corren contra
      # LocalStack real, nunca mockean el SDK de AWS (misma filosofía que
      # Postgres/Redis en los servicios).
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sns,sqs,scheduler,iam,sts
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AWS_ENDPOINT_URL: http://localhost:4566

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (workspace root)
        run: npm install --workspace=packages/messaging --include-workspace-root

      - name: Lint
        working-directory: packages/messaging
        run: npm run lint

      - name: Typecheck
        working-directory: packages/messaging
        run: npm run typecheck

      - name: Build
        working-directory: packages/messaging
        run: npm run build

      - name: Test
        working-directory: packages/messaging
        run: npm run test
