name: CI - payments

on:
  push:
    branches: ['**']
    paths:
      - 'services/payments/**'
      - 'packages/authz/**'
      - 'packages/messaging/**'
      - 'packages/contracts/payments/**'
      - 'scripts/localstack-setup.mjs'
      # Contract test (Pact, PLAN.md Fase 4): ver nota equivalente en
      # doctors-ci.yml.
      - 'pacts/appointments-payments.json'
      - 'tsconfig.base.json'
      - '.github/workflows/payments-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/payments/**'
      - 'packages/authz/**'
      - 'packages/messaging/**'
      - 'packages/contracts/payments/**'
      - 'scripts/localstack-setup.mjs'
      # Contract test (Pact, PLAN.md Fase 4): ver nota equivalente en
      # doctors-ci.yml.
      - 'pacts/appointments-payments.json'
      - 'tsconfig.base.json'
      - '.github/workflows/payments-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Fase 3b (ADR-014): emula SNS -- reemplaza la cola redis usada antes
      # solo para publicar (Payments nunca consumió eventos).
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sns,sqs,scheduler
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4004
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://payments:payments@localhost:5432/payments_db?schema=public
      DATABASE_URL_APP: postgresql://app_role:app_role_dev_password@localhost:5432/payments_db?schema=public
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DOMAIN_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:clinica-test-domain-events
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz y @clinica/messaging no están publicados,
      # hay que instalar desde la raíz (ver build: convertir el repo en npm
      # workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=services/payments --workspace=packages/authz --workspace=packages/messaging --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Build @clinica/messaging
        run: npm run build --workspace=packages/messaging

      - name: Install scripts dependencies
        working-directory: scripts
        run: npm install

      - name: Provision LocalStack (topic/colas/DLQs/schedule-group)
        working-directory: scripts
        run: npm run localstack:setup

      - name: Generate Prisma Client
        working-directory: services/payments
        run: npm run prisma:generate

      - name: Lint
        working-directory: services/payments
        run: npm run lint

      - name: Apply migrations
        working-directory: services/payments
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/payments
        run: npm run typecheck

      - name: Test
        working-directory: services/payments
        run: npm run test
