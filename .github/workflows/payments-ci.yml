name: CI - payments

on:
  push:
    branches: ['**']
    paths:
      - 'services/payments/**'
      - 'packages/authz/**'
      - 'packages/contracts/payments/**'
      # Contract test (Pact, PLAN.md Fase 4): ver nota equivalente en
      # doctors-ci.yml.
      - 'pacts/appointments-payments.json'
      - 'tsconfig.base.json'
      - '.github/workflows/payments-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/payments/**'
      - 'packages/authz/**'
      - 'packages/contracts/payments/**'
      # Contract test (Pact, PLAN.md Fase 4): ver nota equivalente en
      # doctors-ci.yml.
      - 'pacts/appointments-payments.json'
      - 'tsconfig.base.json'
      - '.github/workflows/payments-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4004
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://payments:payments@localhost:5432/payments_db?schema=public
      DATABASE_URL_APP: postgresql://app_role:app_role_dev_password@localhost:5432/payments_db?schema=public
      REDIS_URL: redis://localhost:6379
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz no esta publicado, hay que instalar desde
      # la raiz (ver build: convertir el repo en npm workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=services/payments --workspace=packages/authz --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Generate Prisma Client
        working-directory: services/payments
        run: npm run prisma:generate

      - name: Lint
        working-directory: services/payments
        run: npm run lint

      - name: Apply migrations
        working-directory: services/payments
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/payments
        run: npm run typecheck

      - name: Test
        working-directory: services/payments
        run: npm run test
