name: CI - notifications

on:
  push:
    branches: ['**']
    paths:
      - 'services/notifications/**'
      - 'packages/authz/**'
      - 'packages/messaging/**'
      - 'packages/contracts/notifications/**'
      - 'scripts/localstack-setup.mjs'
      - 'tsconfig.base.json'
      - '.github/workflows/notifications-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/notifications/**'
      - 'packages/authz/**'
      - 'packages/messaging/**'
      - 'packages/contracts/notifications/**'
      - 'scripts/localstack-setup.mjs'
      - 'tsconfig.base.json'
      - '.github/workflows/notifications-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Fase 3b (ADR-014): emula SNS/SQS -- reemplaza el servicio redis que
      # tenía este workflow.
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sns,sqs,scheduler
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4005
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://notifications:notifications@localhost:5432/notifications_db?schema=public
      RESEND_API_KEY: re_dummy
      RESEND_FROM_EMAIL: no-reply@clinica.example.com
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      NOTIFICATIONS_DOMAIN_EVENTS_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-notifications-domain-events
      NOTIFICATIONS_DOMAIN_EVENTS_DLQ_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-notifications-domain-events-dlq
      NOTIFICATIONS_DOMAIN_EVENTS_MAX_RECEIVE_COUNT: '5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz y @clinica/messaging no están publicados,
      # hay que instalar desde la raíz (ver build: convertir el repo en npm
      # workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=services/notifications --workspace=packages/authz --workspace=packages/messaging --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Build @clinica/messaging
        run: npm run build --workspace=packages/messaging

      - name: Install scripts dependencies
        working-directory: scripts
        run: npm install

      - name: Provision LocalStack (topic/colas/DLQs/schedule-group)
        working-directory: scripts
        run: npm run localstack:setup

      - name: Generate Prisma Client
        working-directory: services/notifications
        run: npm run prisma:generate

      - name: Lint
        working-directory: services/notifications
        run: npm run lint

      - name: Apply migrations
        working-directory: services/notifications
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/notifications
        run: npm run typecheck

      - name: Test
        working-directory: services/notifications
        run: npm run test
