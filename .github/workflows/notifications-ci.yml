name: CI - notifications

on:
  push:
    branches: ['**']
    paths:
      - 'services/notifications/**'
      - 'packages/authz/**'
      - 'packages/contracts/notifications/**'
      - 'tsconfig.base.json'
      - '.github/workflows/notifications-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/notifications/**'
      - 'packages/authz/**'
      - 'packages/contracts/notifications/**'
      - 'tsconfig.base.json'
      - '.github/workflows/notifications-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4005
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://notifications:notifications@localhost:5432/notifications_db?schema=public
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: re_dummy
      RESEND_FROM_EMAIL: no-reply@clinica.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz no esta publicado, hay que instalar desde
      # la raiz (ver build: convertir el repo en npm workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=services/notifications --workspace=packages/authz --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Generate Prisma Client
        working-directory: services/notifications
        run: npm run prisma:generate

      - name: Lint
        working-directory: services/notifications
        run: npm run lint

      - name: Apply migrations
        working-directory: services/notifications
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/notifications
        run: npm run typecheck

      - name: Test
        working-directory: services/notifications
        run: npm run test
