name: CI - appointments

on:
  push:
    branches: ['**']
    paths:
      - 'services/appointments/**'
      - 'packages/authz/**'
      - 'packages/messaging/**'
      - 'packages/contracts/appointments/**'
      - 'scripts/localstack-setup.mjs'
      # Contract test de mensajes (Pact, PLAN.md Fase 4): Appointments es el
      # provider/productor del evento — si Notifications cambia lo que
      # espera, commitea un pact nuevo acá.
      - 'pacts/notifications-appointments.json'
      - 'tsconfig.base.json'
      - '.github/workflows/appointments-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/appointments/**'
      - 'packages/authz/**'
      - 'packages/messaging/**'
      - 'packages/contracts/appointments/**'
      - 'scripts/localstack-setup.mjs'
      # Contract test de mensajes (Pact, PLAN.md Fase 4): Appointments es el
      # provider/productor del evento — si Notifications cambia lo que
      # espera, commitea un pact nuevo acá.
      - 'pacts/notifications-appointments.json'
      - 'tsconfig.base.json'
      - '.github/workflows/appointments-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appointments
          POSTGRES_PASSWORD: appointments
          POSTGRES_DB: appointments_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Fase 3b (ADR-014): emula SNS/SQS/EventBridge Scheduler -- reemplaza
      # redis (Streams para eventos de dominio, BullMQ para las 3 colas de
      # expiration/reminders/noshow).
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: sns,sqs,scheduler
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4002
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://appointments:appointments@localhost:5432/appointments_db?schema=public
      DATABASE_URL_APP: postgresql://app_role:app_role_dev_password@localhost:5432/appointments_db?schema=public
      DOCTORS_SERVICE_URL: http://localhost:4003
      PAYMENTS_SERVICE_URL: http://localhost:4004
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DOMAIN_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:clinica-test-domain-events
      APPOINTMENTS_DOMAIN_EVENTS_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-appointments-domain-events
      APPOINTMENTS_DOMAIN_EVENTS_DLQ_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-appointments-domain-events-dlq
      APPOINTMENTS_DOMAIN_EVENTS_MAX_RECEIVE_COUNT: 5
      APPOINTMENT_EXPIRATION_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-appointment-expiration
      APPOINTMENT_EXPIRATION_QUEUE_ARN: arn:aws:sqs:us-east-1:000000000000:clinica-test-appointment-expiration
      APPOINTMENT_EXPIRATION_MAX_RECEIVE_COUNT: 1
      APPOINTMENT_REMINDERS_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-appointment-reminders
      APPOINTMENT_REMINDERS_QUEUE_ARN: arn:aws:sqs:us-east-1:000000000000:clinica-test-appointment-reminders
      APPOINTMENT_REMINDERS_DLQ_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-appointment-reminders-dlq
      APPOINTMENT_REMINDERS_MAX_RECEIVE_COUNT: 3
      APPOINTMENT_NOSHOW_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/clinica-test-appointment-noshow
      SCHEDULER_GROUP_NAME: clinica-test-appointment-schedules
      SCHEDULER_EXECUTION_ROLE_ARN: arn:aws:iam::000000000000:role/clinica-test-scheduler-execution-role

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz y @clinica/messaging no están publicados,
      # hay que instalar desde la raíz (ver build: convertir el repo en npm
      # workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=services/appointments --workspace=packages/authz --workspace=packages/messaging --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Build @clinica/messaging
        run: npm run build --workspace=packages/messaging

      - name: Install scripts dependencies
        working-directory: scripts
        run: npm install

      - name: Provision LocalStack (topic/colas/DLQs/schedule-group)
        working-directory: scripts
        run: npm run localstack:setup

      - name: Generate Prisma Client
        working-directory: services/appointments
        run: npm run prisma:generate

      - name: Lint
        working-directory: services/appointments
        run: npm run lint

      - name: Apply migrations
        working-directory: services/appointments
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/appointments
        run: npm run typecheck

      - name: Test
        working-directory: services/appointments
        run: npm run test
