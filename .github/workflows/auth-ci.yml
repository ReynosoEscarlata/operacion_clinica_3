name: CI - auth

on:
  push:
    branches: ['**']
    paths:
      - 'services/auth/**'
      - 'packages/authz/**'
      - 'packages/contracts/auth/**'
      # Contract test (Pact, PLAN.md Fase 4): ver nota equivalente en
      # doctors-ci.yml.
      - 'pacts/gateway-auth.json'
      - 'tsconfig.base.json'
      - '.github/workflows/auth-ci.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'services/auth/**'
      - 'packages/authz/**'
      - 'packages/contracts/auth/**'
      # Contract test (Pact, PLAN.md Fase 4): ver nota equivalente en
      # doctors-ci.yml.
      - 'pacts/gateway-auth.json'
      - 'tsconfig.base.json'
      - '.github/workflows/auth-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4001
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://auth:auth@localhost:5432/auth_db?schema=public
      DATABASE_URL_APP: postgresql://app_role:app_role_dev_password@localhost:5432/auth_db?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Workspace: @clinica/authz no esta publicado, npm no lo resuelve si
      # se instala desde dentro de services/auth -- hay que instalar desde
      # la raiz (ver build: convertir el repo en npm workspaces).
      - name: Install dependencies (workspace root)
        run: npm install --workspace=services/auth --workspace=packages/authz --include-workspace-root

      - name: Build @clinica/authz
        run: npm run build --workspace=packages/authz

      - name: Generate Prisma Client
        working-directory: services/auth
        run: npm run prisma:generate

      - name: Lint
        working-directory: services/auth
        run: npm run lint

      - name: Apply migrations
        working-directory: services/auth
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: services/auth
        run: npm run typecheck

      - name: Test
        working-directory: services/auth
        run: npm run test
